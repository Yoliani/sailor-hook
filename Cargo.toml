[package]
name = "sailor-hook"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Host daemon that bridges AI coding agents to the sailor mobile app."
repository = "https://github.com/Yoliani/sailor-hook"
homepage = "https://sailor.dev"

[[bin]]
name = "sailor-hook"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP gateway + websocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
# Serialization. `preserve_order` matters: `install` rewrites the user's own
# agent settings file, and reordering their keys would be a gratuitous diff.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Kimi's hook config is TOML (`~/.kimi-code/config.toml`), the one non-JSON
# agent config install touches.
toml = { version = "0.8", features = ["preserve_order"] }
# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
# Self-hostable push delivery (ntfy / Gotify / UnifiedPush). rustls rather
# than the platform TLS stack so the binary stays self-contained.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
# Secrets storage
keyring = "3"
# Misc
dirs = "5"
# LAN discovery (mDNS advertiser for `sailor-hook advertise`)
mdns-sd = "0.13"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Terminal QR code for `easy-pair` (image rendering not needed)
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
# Drive the gateway's `WS /events` the way the app does (tests/gateway.rs).
tokio-tungstenite = "0.24"
futures-util = "0.3"
