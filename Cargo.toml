[package]
name = "sailor-hook"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Host daemon that bridges AI coding agents to the sailor mobile app."
repository = "https://github.com/usesailor/sailor"
homepage = "https://sailor.dev"

[[bin]]
name = "sailor-hook"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP gateway + websocket
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
# Secrets storage
keyring = "3"
# Misc
dirs = "5"
# LAN discovery (mDNS advertiser for `sailor-hook advertise`)
mdns-sd = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
